<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LUXE | Admin & User Management</title>
    <style>
        /* --- CSS VARIABLES & RESET --- */
        :root {
            --bg-color: #ffffff;
            --text-color: #1a1a1a;
            --accent-color: #000000;
            --secondary-text: #666666;
            --border-color: #e5e5e5;
            --card-bg: #ffffff;
            --nav-height: 70px;
            --success-color: #28a745;
            --danger-color: #dc3545;
            --heart-color: #dc3545;
            --font-main: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            --shadow: 0 4px 12px rgba(0, 0, 0, 0.05);
            --transition: all 0.3s ease;
        }

        [data-theme="dark"] {
            --bg-color: #121212;
            --text-color: #f5f5f5;
            --accent-color: #ffffff;
            --secondary-text: #a0a0a0;
            --border-color: #333333;
            --card-bg: #1e1e1e;
            --shadow: 0 4px 12px rgba(0, 0, 0, 0.5);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: var(--font-main);
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            transition: var(--transition);
            line-height: 1.6;
            padding-top: var(--nav-height);
        }

        a {
            text-decoration: none;
            color: inherit;
            cursor: pointer;
        }

        ul {
            list-style: none;
        }

        img {
            max-width: 100%;
            display: block;
        }

        button {
            cursor: pointer;
            border: none;
            background: none;
            font-family: inherit;
        }

        /* --- LAYOUT UTILITIES --- */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
        }

        .flex {
            display: flex;
            align-items: center;
        }

        .flex-between {
            justify-content: space-between;
        }

        .grid {
            display: grid;
            gap: 20px;
        }

        .grid-3 {
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
        }

        .grid-4 {
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
        }

        .mt-20 {
            margin-top: 20px;
        }

        .mb-20 {
            margin-bottom: 20px;
        }

        .hidden {
            display: none !important;
        }

        /* --- BUTTONS & INPUTS --- */
        .btn {
            padding: 12px 24px;
            background-color: var(--accent-color);
            color: var(--bg-color);
            font-weight: 600;
            border-radius: 4px;
            transition: var(--transition);
            text-transform: uppercase;
            letter-spacing: 1px;
            font-size: 0.85rem;
        }

        .btn:hover {
            opacity: 0.8;
            transform: translateY(-1px);
        }

        .btn-outline {
            background: transparent;
            border: 1px solid var(--accent-color);
            color: var(--accent-color);
        }

        [data-theme="dark"] .btn-outline {
            border-color: var(--accent-color);
            color: var(--accent-color);
        }

        .btn-sm {
            padding: 8px 16px;
            font-size: 0.75rem;
        }

        .btn-danger {
            background-color: var(--danger-color);
            color: white;
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--border-color);
            background: var(--bg-color);
            color: var(--text-color);
            border-radius: 4px;
            margin-bottom: 15px;
            outline: none;
        }

        input:focus {
            border-color: var(--accent-color);
        }

        input[type="file"] {
            padding: 10px 0;
            cursor: pointer;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-size: 0.9rem;
            color: var(--secondary-text);
        }

        /* --- NAVBAR --- */
        .navbar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: var(--nav-height);
            background: var(--bg-color);
            border-bottom: 1px solid var(--border-color);
            z-index: 1000;
            display: flex;
            align-items: center;
        }

        .nav-logo {
            font-size: 1.5rem;
            font-weight: 800;
            letter-spacing: -1px;
        }

        .nav-links {
            gap: 30px;
        }

        .nav-links a {
            font-size: 0.9rem;
            font-weight: 500;
            opacity: 0.8;
            transition: opacity 0.2s;
        }

        .nav-links a:hover,
        .nav-links a.active {
            opacity: 1;
            font-weight: 700;
        }

        .nav-actions {
            gap: 15px;
        }

        .icon-btn {
            font-size: 1.2rem;
            position: relative;
        }

        .fav-btn {
            font-size: 1.5rem;
            color: var(--secondary-text);
            transition: color 0.2s, transform 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 40px;
            height: 40px;
            border-radius: 50%;
        }

        .fav-btn:hover {
            background-color: rgba(0, 0, 0, 0.05);
            color: var(--heart-color);
        }

        [data-theme="dark"] .fav-btn:hover {
            background-color: rgba(255, 255, 255, 0.1);
        }

        .fav-btn.active {
            color: var(--heart-color);
            animation: pulse 0.3s ease-in-out;
        }

        @keyframes pulse {
            0% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.2);
            }

            100% {
                transform: scale(1);
            }
        }

        .badge {
            position: absolute;
            top: -5px;
            right: -8px;
            background: var(--accent-color);
            color: var(--bg-color);
            font-size: 0.7rem;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* --- PAGES --- */
        .page-header {
            padding: 60px 0 40px;
            text-align: center;
        }

        .page-title {
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 10px;
        }

        /* --- PRODUCT CARD --- */
        .product-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            overflow: hidden;
            transition: var(--transition);
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .product-card:hover {
            transform: translateY(-5px);
            box-shadow: var(--shadow);
        }

        .product-img-wrapper {
            height: 250px;
            overflow: hidden;
            position: relative;
            background: #f4f4f4;
        }

        .product-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s;
        }

        .product-card:hover .product-img {
            transform: scale(1.05);
        }

        .card-fav {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(255, 255, 255, 0.8);
            border-radius: 50%;
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 2;
            transition: var(--transition);
        }

        .card-fav:hover {
            transform: scale(1.1);
            background: white;
        }

        .card-fav.active {
            color: var(--heart-color);
        }

        .product-info {
            padding: 20px;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
        }

        .product-cat {
            font-size: 0.75rem;
            color: var(--secondary-text);
            text-transform: uppercase;
            margin-bottom: 5px;
        }

        .product-name {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 10px;
        }

        .product-price {
            font-size: 1.2rem;
            font-weight: 700;
            margin-top: auto;
        }

        .stock-status {
            font-size: 0.8rem;
            margin-top: 5px;
        }

        .in-stock {
            color: var(--success-color);
        }

        .out-stock {
            color: var(--danger-color);
        }

        .card-actions {
            margin-top: 15px;
            display: grid;
            gap: 10px;
        }

        /* --- CART & AUTH --- */
        .auth-container {
            max-width: 400px;
            margin: 0 auto;
            padding: 40px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
        }

        .cart-item {
            display: flex;
            gap: 20px;
            padding: 20px 0;
            border-bottom: 1px solid var(--border-color);
        }

        .cart-img {
            width: 80px;
            height: 80px;
            object-fit: cover;
            border-radius: 4px;
        }

        .cart-details {
            flex-grow: 1;
        }

        .cart-controls {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 10px;
        }

        .qty-btn {
            width: 25px;
            height: 25px;
            background: var(--border-color);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .cart-summary {
            background: var(--card-bg);
            padding: 30px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            margin-top: 30px;
        }

        /* --- ADMIN DASHBOARD --- */
        .admin-layout {
            display: grid;
            grid-template-columns: 250px 1fr;
            min-height: 80vh;
        }

        .admin-sidebar {
            background: var(--card-bg);
            border-right: 1px solid var(--border-color);
            padding: 20px;
        }

        .admin-menu li {
            padding: 15px;
            cursor: pointer;
            border-radius: 4px;
            color: var(--secondary-text);
            margin-bottom: 5px;
        }

        .admin-menu li:hover,
        .admin-menu li.active {
            background: var(--accent-color);
            color: var(--bg-color);
        }

        .admin-content {
            padding: 30px;
        }

        .stat-card {
            background: var(--card-bg);
            padding: 20px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            text-align: center;
        }

        .stat-number {
            font-size: 2rem;
            font-weight: 700;
            margin: 10px 0;
        }

        .table-wrapper {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th,
        td {
            padding: 15px;
            text-align: left;
            border-bottom: 1px solid var(--border-color);
        }

        th {
            font-weight: 600;
            color: var(--secondary-text);
            font-size: 0.9rem;
        }

        /* --- MODAL & TOAST --- */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 2000;
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
        }

        .modal-overlay.open {
            opacity: 1;
            pointer-events: all;
        }

        .modal {
            background: var(--bg-color);
            width: 90%;
            max-width: 600px;
            /* Slightly wider for user details */
            padding: 30px;
            border-radius: 8px;
            position: relative;
            transform: translateY(20px);
            transition: transform 0.3s;
            max-height: 90vh;
            overflow-y: auto;
        }

        .modal-overlay.open .modal {
            transform: translateY(0);
        }

        .close-modal {
            position: absolute;
            top: 15px;
            right: 20px;
            font-size: 1.5rem;
            cursor: pointer;
        }

        .toast {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: var(--accent-color);
            color: var(--bg-color);
            padding: 15px 25px;
            border-radius: 4px;
            transform: translateY(100px);
            transition: transform 0.3s;
            z-index: 3000;
            box-shadow: var(--shadow);
        }

        .toast.show {
            transform: translateY(0);
        }

        .img-preview {
            width: 100%;
            height: 200px;
            object-fit: cover;
            border-radius: 4px;
            margin-bottom: 15px;
            background-color: #f0f0f0;
            display: none;
            border: 1px dashed var(--border-color);
        }

        /* User Specific Styles */
        .order-history-item {
            border: 1px solid var(--border-color);
            padding: 15px;
            border-radius: 6px;
            margin-bottom: 10px;
            background: var(--bg-color);
        }

        .order-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            font-weight: bold;
            font-size: 0.9rem;
            color: var(--secondary-text);
        }

        .order-products-list {
            font-size: 0.9rem;
        }

        .order-products-list li {
            display: flex;
            justify-content: space-between;
            margin-bottom: 5px;
            padding-bottom: 5px;
            border-bottom: 1px dashed var(--border-color);
        }

        /* --- RESPONSIVE --- */
        @media (max-width: 768px) {
            .nav-links {
                display: none;
            }

            .admin-layout {
                grid-template-columns: 1fr;
            }

            .admin-sidebar {
                display: flex;
                overflow-x: auto;
                gap: 10px;
                padding: 10px;
                border-bottom: 1px solid var(--border-color);
                border-right: none;
            }

            .admin-menu li {
                white-space: nowrap;
            }
        }
    </style>
</head>

<body>

    <!-- NAVBAR -->
    <nav class="navbar">
        <div class="container flex flex-between" style="width: 100%">
            <a href="#" onclick="router.navigate('/')" class="nav-logo">LUXE.</a>

            <ul class="nav-links flex" id="main-nav">
                <li><a onclick="router.navigate('/')">Home</a></li>
                <li><a onclick="router.navigate('/shop')">Shop</a></li>
                <li id="nav-admin" class="hidden"><a onclick="router.navigate('/admin')">Admin</a></li>
            </ul>

            <div class="nav-actions flex">
                <button class="icon-btn" onclick="app.toggleTheme()">◐</button>
                <div class="search-bar" style="display:flex;">
                    <input type="text" id="global-search" placeholder="Search..."
                        style="margin-bottom:0; padding: 5px 10px; width: 120px; border:none; background: transparent; border-bottom: 1px solid var(--border-color);">
                </div>
                <button class="icon-btn" onclick="router.navigate('/cart')">
                    Cart <span class="badge" id="cart-count">0</span>
                </button>
                <div id="auth-buttons">
                    <!-- Injected by JS -->
                </div>
            </div>
        </div>
    </nav>

    <!-- MAIN CONTENT AREA -->
    <main id="app-root">
        <!-- Views render here -->
    </main>

    <!-- FOOTER -->
    <footer
        style="background: var(--card-bg); padding: 40px 0; border-top: 1px solid var(--border-color); margin-top: 60px;">
        <div class="container flex flex-between" style="flex-wrap: wrap; gap: 20px;">
            <div>
                <h3>LUXE.</h3>
                <p style="color: var(--secondary-text); font-size: 0.9rem;">Premium E-Commerce Experience.</p>
            </div>
            <div>
                <p>&copy; 2023 LUXE Inc. All rights reserved.</p>
            </div>
        </div>
    </footer>

    <!-- MODAL: CHECKOUT -->
    <div class="modal-overlay" id="checkout-modal">
        <div class="modal">
            <span class="close-modal" onclick="modal.close('checkout-modal')">&times;</span>
            <h2 class="mb-20">Secure Checkout</h2>
            <form id="checkout-form" onsubmit="app.processCheckout(event)">
                <label>Full Name</label>
                <input type="text" id="checkout-name" required>
                <label>Email Address</label>
                <input type="email" id="checkout-email" required>
                <label>Phone Number</label>
                <input type="tel" id="checkout-phone" required>

                <div
                    style="background: var(--bg-color); border: 1px solid var(--border-color); padding: 15px; margin-bottom: 20px; border-radius: 4px;">
                    <p><strong>Order Summary:</strong> <span id="modal-total-items"></span> items</p>
                    <p><strong>Total Amount:</strong> $<span id="modal-total-price"></span></p>
                </div>

                <button type="submit" class="btn" style="width: 100%">Submit Order</button>
            </form>
        </div>
    </div>

    <!-- MODAL: ADD PRODUCT -->
    <div class="modal-overlay" id="add-product-modal">
        <div class="modal">
            <span class="close-modal" onclick="modal.close('add-product-modal')">&times;</span>
            <h2 class="mb-20">Add New Product</h2>
            <form id="add-product-form" onsubmit="app.handleAddProduct(event)">
                <label>Product Name</label>
                <input type="text" name="name" required>

                <div class="grid" style="grid-template-columns: 1fr 1fr; gap: 10px;">
                    <div>
                        <label>Price ($)</label>
                        <input type="number" step="0.01" name="price" required>
                    </div>
                    <div>
                        <label>Stock Qty</label>
                        <input type="number" name="stock" required>
                    </div>
                </div>

                <label>Category</label>
                <select name="category">
                    <option value="Accessories">Accessories</option>
                    <option value="Clothing">Clothing</option>
                    <option value="Bags">Bags</option>
                    <option value="Footwear">Footwear</option>
                    <option value="Jewelry">Jewelry</option>
                </select>

                <label>Description</label>
                <textarea name="desc" rows="3"></textarea>

                <label>Product Image</label>
                <input type="file" id="product-image-input" accept="image/*" onchange="app.previewImage(this)">
                <img id="product-img-preview" class="img-preview" alt="Preview">

                <button type="submit" class="btn" style="width: 100%; margin-top: 10px;">Create Product</button>
            </form>
        </div>
    </div>

    <!-- MODAL: EDIT PROFILE -->
    <div class="modal-overlay" id="edit-profile-modal">
        <div class="modal">
            <span class="close-modal" onclick="modal.close('edit-profile-modal')">&times;</span>
            <h2 class="mb-20">Edit Profile</h2>
            <form id="edit-profile-form" onsubmit="app.handleProfileUpdate(event)">
                <label>Full Name</label>
                <input type="text" id="edit-name" required>
                <label>Email Address</label>
                <input type="email" id="edit-email" required>
                <label>Password (Leave blank to keep current)</label>
                <input type="password" id="edit-password" placeholder="New Password">
                <button type="submit" class="btn" style="width: 100%">Save Changes</button>
            </form>
        </div>
    </div>

    <!-- MODAL: USER DETAILS (For Admin) -->
    <div class="modal-overlay" id="user-details-modal">
        <div class="modal">
            <span class="close-modal" onclick="modal.close('user-details-modal')">&times;</span>
            <h2 class="mb-20">User History</h2>
            <div id="user-details-content">
                <!-- Content injected via JS -->
            </div>
        </div>
    </div>

    <!-- TOAST -->
    <div id="toast" class="toast">Action Successful</div>

    <script>
        /**
         * STATE MANAGEMENT
         */
        const db = {
            users: JSON.parse(localStorage.getItem('users')) || [
                { id: 'admin1', name: 'Admin User', email: 'admin@luxe.com', password: 'admin', role: 'admin', favorites: [] },
                { id: 'user1', name: 'John Doe', email: 'user@luxe.com', password: 'user', role: 'user', favorites: [] },
                { id: 'user2', name: 'Jane Smith', email: 'jane@luxe.com', password: 'jane', role: 'user', favorites: [] }
            ],
            products: JSON.parse(localStorage.getItem('products')) || [
                { id: 101, name: 'Minimalist Watch', price: 250, category: 'Accessories', stock: 15, image: 'https://picsum.photos/seed/watch/300/300', desc: 'A sleek timepiece for modern professionals.' },
                { id: 102, name: 'Leather Tote Bag', price: 180, category: 'Bags', stock: 8, image: 'https://picsum.photos/seed/bag/300/300', desc: 'Genuine leather tote with spacious compartments.' },
                { id: 103, name: 'Premium Sunglasses', price: 120, category: 'Accessories', stock: 20, image: 'https://picsum.photos/seed/glass/300/300', desc: 'UV protection with a classic frame design.' }
            ],
            orders: JSON.parse(localStorage.getItem('orders')) || [],
            save: () => {
                localStorage.setItem('users', JSON.stringify(db.users));
                localStorage.setItem('products', JSON.stringify(db.products));
                localStorage.setItem('orders', JSON.stringify(db.orders));
            }
        };

        const store = {
            user: JSON.parse(localStorage.getItem('currentUser')) || null,
            cart: JSON.parse(localStorage.getItem('cart')) || [],

            updateCart: (newCart) => {
                store.cart = newCart;
                localStorage.setItem('cart', JSON.stringify(store.cart));
                app.updateCartBadge();
            },

            login: (user) => {
                store.user = user;
                localStorage.setItem('currentUser', JSON.stringify(user));
                app.init();
            },

            logout: () => {
                store.user = null;
                localStorage.removeItem('currentUser');
                router.navigate('/');
                app.init();
            },

            isFav: (productId) => {
                if (!store.user) return false;
                return store.user.favorites && store.user.favorites.includes(productId);
            }
        };

        const utils = {
            formatPrice: (num) => Number(num).toFixed(2),
            generateId: () => Math.random().toString(36).substr(2, 9),
            showToast: (msg) => {
                const toast = document.getElementById('toast');
                toast.textContent = msg;
                toast.classList.add('show');
                setTimeout(() => toast.classList.remove('show'), 3000);
            }
        };

        const router = {
            navigate: (path, params = null) => {
                window.location.hash = params ? `${path}/${params}` : path;
                router.render();
            },
            render: () => {
                const hash = window.location.hash.slice(1) || '/';
                const root = document.getElementById('app-root');
                window.scrollTo(0, 0);

                if (hash === '/') root.innerHTML = views.home();
                else if (hash === '/shop') root.innerHTML = views.shop();
                else if (hash.startsWith('/product/')) {
                    const id = parseInt(hash.split('/')[2]);
                    root.innerHTML = views.productDetail(id);
                }
                else if (hash === '/cart') root.innerHTML = views.cart();
                else if (hash === '/login') root.innerHTML = views.login();
                else if (hash === '/signup') root.innerHTML = views.signup();
                else if (hash === '/profile') {
                    if (!store.user) return router.navigate('/login');
                    root.innerHTML = views.profile();
                }
                else if (hash === '/admin') {
                    if (!store.user || store.user.role !== 'admin') return router.navigate('/');
                    root.innerHTML = views.admin();
                }
                else root.innerHTML = views.home();

                app.postRender(hash);
            }
        };

        const views = {
            home: () => `
                <section class="page-header" style="background: var(--bg-color);">
                    <div class="container">
                        <h1 class="page-title">Minimalist Essentials</h1>
                        <p style="color: var(--secondary-text);">Curated premium goods for the modern lifestyle.</p>
                        <button class="btn mt-20" onclick="router.navigate('/shop')">Shop Now</button>
                    </div>
                </section>
                <section class="container">
                    <h2 class="mb-20">Featured Products</h2>
                    <div class="grid grid-3">
                        ${db.products.slice(0, 3).map(p => components.productCard(p)).join('')}
                    </div>
                </section>
            `,
            shop: () => `
                <div class="container mt-20">
                    <div class="flex flex-between mb-20">
                        <h2>Shop All</h2>
                        <div style="display: flex; gap: 10px;">
                             <select onchange="app.filterProducts(this.value)">
                                <option value="all">All Categories</option>
                                <option value="Accessories">Accessories</option>
                                <option value="Clothing">Clothing</option>
                                <option value="Bags">Bags</option>
                            </select>
                            <select onchange="app.sortProducts(this.value)">
                                <option value="default">Sort By</option>
                                <option value="price-asc">Price: Low to High</option>
                                <option value="price-desc">Price: High to Low</option>
                            </select>
                        </div>
                    </div>
                    <div class="grid grid-3" id="shop-grid">
                        ${db.products.map(p => components.productCard(p)).join('')}
                    </div>
                </div>
            `,
            productDetail: (id) => {
                const p = db.products.find(x => x.id === id);
                if (!p) return `<div class="container mt-20">Product not found</div>`;
                const isFav = store.isFav(id);
                return `
                <div class="container mt-20">
                    <button class="btn-outline btn-sm mb-20" onclick="router.navigate('/shop')">← Back to Shop</button>
                    <div class="grid" style="grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));">
                        <div>
                            <img src="${p.image}" style="width: 100%; border-radius: 8px; height: 400px; object-fit: cover;">
                        </div>
                        <div style="padding: 20px;">
                            <span class="product-cat">${p.category}</span>
                            <h1 style="font-size: 2.5rem; margin: 10px 0;">${p.name}</h1>
                            <p class="product-price" style="font-size: 2rem;">$${utils.formatPrice(p.price)}</p>
                            <p style="color: var(--secondary-text); margin: 20px 0;">${p.desc}</p>
                            <p class="${p.stock > 0 ? 'in-stock' : 'out-stock'} stock-status">
                                ${p.stock > 0 ? `In Stock (${p.stock})` : 'Out of Stock'}
                            </p>
                            <div class="flex" style="gap: 10px; margin-top: 30px;">
                                <button class="btn" style="flex: 2" onclick="app.addToCart(${p.id})">Add to Cart</button>
                                <button class="fav-btn btn-outline ${isFav ? 'active' : ''}" style="flex: 1; border: 1px solid var(--border-color);" onclick="app.toggleFavorite(${p.id})">
                                    ${isFav ? '♥' : '♡'}
                                </button>
                            </div>
                        </div>
                    </div>
                </div>`;
            },
            cart: () => {
                if (store.cart.length === 0) return `<div class="container" style="text-align:center; padding: 100px 0;"><h2>Your cart is empty</h2><button class="btn mt-20" onclick="router.navigate('/shop')">Start Shopping</button></div>`;
                const total = store.cart.reduce((acc, item) => {
                    const p = db.products.find(x => x.id === item.productId);
                    return acc + (p.price * item.qty);
                }, 0);
                return `
                <div class="container mt-20">
                    <h2>Shopping Cart</h2>
                    <div class="grid" style="grid-template-columns: 2fr 1fr; gap: 40px; margin-top: 20px;">
                        <div>
                            ${store.cart.map(item => {
                    const p = db.products.find(x => x.id === item.productId);
                    return `<div class="cart-item">
                                    <img src="${p.image}" class="cart-img">
                                    <div class="cart-details">
                                        <h3>${p.name}</h3>
                                        <p class="product-price">$${utils.formatPrice(p.price)}</p>
                                        <div class="cart-controls">
                                            <button class="qty-btn" onclick="app.updateQty(${item.productId}, -1)">-</button>
                                            <span>${item.qty}</span>
                                            <button class="qty-btn" onclick="app.updateQty(${item.productId}, 1)">+</button>
                                            <button class="btn-sm btn-outline" style="margin-left: auto; color: var(--danger-color); border-color: var(--danger-color);" onclick="app.removeFromCart(${item.productId})">Remove</button>
                                        </div>
                                    </div>
                                </div>`;
                }).join('')}
                        </div>
                        <div>
                            <div class="cart-summary">
                                <h3>Order Summary</h3>
                                <div class="flex flex-between mt-20"><span>Subtotal</span><span>$${utils.formatPrice(total)}</span></div>
                                <div class="flex flex-between mt-20"><span>Shipping</span><span>Free</span></div>
                                <hr style="margin: 20px 0; border: 0; border-top: 1px solid var(--border-color);">
                                <div class="flex flex-between" style="font-weight: 700; font-size: 1.2rem;"><span>Total</span><span>$${utils.formatPrice(total)}</span></div>
                                <button class="btn mt-20" style="width: 100%" onclick="app.openCheckout(${total})">Proceed to Checkout</button>
                            </div>
                        </div>
                    </div>
                </div>`;
            },
            login: () => `
                <div class="auth-container mt-20">
                    <h2 class="mb-20" style="text-align:center">Welcome Back</h2>
                    <form onsubmit="app.handleLogin(event)">
                        <label>Email</label>
                        <input type="email" name="email" required value="admin@luxe.com">
                        <label>Password</label>
                        <input type="password" name="password" required value="admin">
                        <button type="submit" class="btn" style="width: 100%">Login</button>
                    </form>
                    <p class="mt-20" style="text-align:center; font-size: 0.9rem;">
                        Don't have an account? <a onclick="router.navigate('/signup')" style="text-decoration: underline;">Sign up</a>
                    </p>
                </div>
            `,
            signup: () => `
                <div class="auth-container mt-20">
                    <h2 class="mb-20" style="text-align:center">Create Account</h2>
                    <form onsubmit="app.handleSignup(event)">
                        <label>Full Name</label><input type="text" name="name" required>
                        <label>Email</label><input type="email" name="email" required>
                        <label>Password</label><input type="password" name="password" required>
                        <label>Confirm Password</label><input type="password" name="confirm" required>
                        <button type="submit" class="btn" style="width: 100%">Sign Up</button>
                    </form>
                    <p class="mt-20" style="text-align:center; font-size: 0.9rem;">
                        Already have an account? <a onclick="router.navigate('/login')" style="text-decoration: underline;">Login</a>
                    </p>
                </div>
            `,
            profile: () => `
                <div class="container mt-20">
                    <div class="flex flex-between mb-20">
                        <h1>My Profile</h1>
                        <button class="btn btn-outline" onclick="store.logout()">Logout</button>
                    </div>
                    <div class="grid" style="grid-template-columns: 1fr 2fr;">
                        <div style="padding: 20px; border: 1px solid var(--border-color); border-radius: 8px; height: fit-content;">
                            <h3>${store.user.name}</h3>
                            <p style="color: var(--secondary-text);">${store.user.email}</p>
                            <div class="mt-20">
                                <button class="btn-outline btn-sm" style="width: 100%; text-align: left;" onclick="app.openEditProfile()">Edit Profile</button>
                            </div>
                        </div>
                        <div>
                            <h3>Order History</h3>
                            ${db.orders.filter(o => o.customerEmail === store.user.email).length === 0
                    ? '<p style="color: var(--secondary-text);">No orders found.</p>'
                    : `<table>
                                    <thead><tr><th>Order ID</th><th>Date</th><th>Total</th><th>Status</th></tr></thead>
                                    <tbody>
                                        ${db.orders.filter(o => o.customerEmail === store.user.email).map(o => `
                                            <tr><td>#${o.id}</td><td>${o.date}</td><td>$${o.totalAmount}</td><td><span style="color: var(--success-color)">Completed</span></td></tr>
                                        `).join('')}
                                    </tbody>
                                   </table>`
                }
                        </div>
                    </div>
                </div>
            `,
            admin: () => `
                <div class="admin-layout">
                    <aside class="admin-sidebar">
                        <h3 class="mb-20">Admin Panel</h3>
                        <ul class="admin-menu">
                            <li onclick="app.switchAdminTab('dashboard')" id="tab-dashboard" class="active">Dashboard</li>
                            <li onclick="app.switchAdminTab('products')" id="tab-products">Products</li>
                            <li onclick="app.switchAdminTab('orders')" id="tab-orders">Orders</li>
                            <li onclick="app.switchAdminTab('users')" id="tab-users">Users Control</li>
                        </ul>
                    </aside>
                    <main class="admin-content" id="admin-view-content">
                        <!-- Content injected via JS -->
                    </main>
                </div>
            `
        };

        const components = {
            productCard: (p) => {
                const isFav = store.isFav(p.id);
                return `
                <div class="product-card">
                    <div class="product-img-wrapper">
                        <div class="card-fav ${isFav ? 'active' : ''}" onclick="app.toggleFavorite(${p.id}, event)">
                            ${isFav ? '♥' : '♡'}
                        </div>
                        <img src="${p.image}" class="product-img" alt="${p.name}">
                    </div>
                    <div class="product-info">
                        <div class="product-cat">${p.category}</div>
                        <h3 class="product-name">${p.name}</h3>
                        <div class="product-price">$${utils.formatPrice(p.price)}</div>
                        <div class="${p.stock > 0 ? 'in-stock' : 'out-stock'} stock-status">
                            ${p.stock > 0 ? 'In Stock' : 'Out of Stock'}
                        </div>
                        <div class="card-actions">
                            <button class="btn btn-sm" onclick="app.addToCart(${p.id})">Add to Cart</button>
                            <button class="btn-outline btn-sm" onclick="router.navigate('/product/${p.id}')">View</button>
                        </div>
                    </div>
                </div>
            `}
        };

        const app = {
            init: () => {
                app.updateCartBadge();
                app.renderAuthButtons();
                if (localStorage.getItem('theme') === 'dark') {
                    document.body.setAttribute('data-theme', 'dark');
                }
                const adminLink = document.getElementById('nav-admin');
                if (store.user && store.user.role === 'admin') {
                    adminLink.classList.remove('hidden');
                } else {
                    adminLink.classList.add('hidden');
                }
                window.addEventListener('hashchange', router.render);
                router.render();
            },

            postRender: (hash) => {
                if (hash === '/admin') app.switchAdminTab('dashboard');
            },

            renderAuthButtons: () => {
                const container = document.getElementById('auth-buttons');
                if (store.user) {
                    container.innerHTML = `<button class="icon-btn" onclick="router.navigate('/profile')">👤</button>`;
                } else {
                    container.innerHTML = `<button class="btn btn-sm" onclick="router.navigate('/login')">Login</button>`;
                }
            },

            toggleTheme: () => {
                const body = document.body;
                if (body.hasAttribute('data-theme')) {
                    body.removeAttribute('data-theme');
                    localStorage.setItem('theme', 'light');
                } else {
                    body.setAttribute('data-theme', 'dark');
                    localStorage.setItem('theme', 'dark');
                }
            },

            updateCartBadge: () => {
                const count = store.cart.reduce((acc, item) => acc + item.qty, 0);
                document.getElementById('cart-count').textContent = count;
            },

            addToCart: (id) => {
                const product = db.products.find(p => p.id === id);
                if (product.stock <= 0) return utils.showToast('Sorry, item is out of stock');
                const existing = store.cart.find(item => item.productId === id);
                let newCart = existing
                    ? store.cart.map(item => item.productId === id ? { ...item, qty: item.qty + 1 } : item)
                    : [...store.cart, { productId: id, qty: 1 }];
                store.updateCart(newCart);
                utils.showToast('Added to cart');
            },

            removeFromCart: (id) => {
                store.updateCart(store.cart.filter(item => item.productId !== id));
                router.render();
            },

            updateQty: (id, change) => {
                const newCart = store.cart.map(item => item.productId === id ? { ...item, qty: Math.max(1, item.qty + change) } : item);
                store.updateCart(newCart);
                router.render();
            },

            toggleFavorite: (id, event) => {
                if (event) event.stopPropagation();
                if (!store.user) return utils.showToast('Please login to save favorites');
                if (!store.user.favorites) store.user.favorites = [];
                const index = store.user.favorites.indexOf(id);
                if (index === -1) {
                    store.user.favorites.push(id);
                    utils.showToast('Added to favorites');
                } else {
                    store.user.favorites.splice(index, 1);
                    utils.showToast('Removed from favorites');
                }
                const dbUserIndex = db.users.findIndex(u => u.id === store.user.id);
                if (dbUserIndex !== -1) {
                    db.users[dbUserIndex] = store.user;
                    db.save();
                }
                localStorage.setItem('currentUser', JSON.stringify(store.user));
                router.render();
            },

            handleLogin: (e) => {
                e.preventDefault();
                const { email, password } = Object.fromEntries(new FormData(e.target));
                const user = db.users.find(u => u.email === email && u.password === password);
                if (user) {
                    store.login(user);
                    utils.showToast(`Welcome back, ${user.name}`);
                    router.navigate(user.role === 'admin' ? '/admin' : '/profile');
                } else {
                    utils.showToast('Invalid credentials');
                }
            },

            handleSignup: (e) => {
                e.preventDefault();
                const { name, email, password, confirm } = Object.fromEntries(new FormData(e.target));
                if (password !== confirm) return utils.showToast('Passwords do not match');
                if (db.users.find(u => u.email === email)) return utils.showToast('Email already registered');
                const newUser = { id: utils.generateId(), name, email, password, role: 'user', favorites: [], createdAt: new Date().toISOString() };
                db.users.push(newUser);
                db.save();
                store.login(newUser);
                utils.showToast('Account created successfully');
                router.navigate('/shop');
            },

            openEditProfile: () => {
                document.getElementById('edit-name').value = store.user.name;
                document.getElementById('edit-email').value = store.user.email;
                document.getElementById('edit-password').value = '';
                modal.open('edit-profile-modal');
            },

            handleProfileUpdate: (e) => {
                e.preventDefault();
                const name = document.getElementById('edit-name').value;
                const email = document.getElementById('edit-email').value;
                const password = document.getElementById('edit-password').value;
                if (db.users.find(u => u.email === email && u.id !== store.user.id)) return utils.showToast('Email is already taken');
                store.user.name = name;
                store.user.email = email;
                if (password) store.user.password = password;
                const dbIndex = db.users.findIndex(u => u.id === store.user.id);
                db.users[dbIndex] = store.user;
                db.save();
                localStorage.setItem('currentUser', JSON.stringify(store.user));
                modal.close('edit-profile-modal');
                utils.showToast('Profile updated successfully');
                router.render();
            },

            openCheckout: (total) => {
                if (!store.user) return router.navigate('/login');
                document.getElementById('modal-total-items').textContent = store.cart.reduce((a, c) => a + c.qty, 0);
                document.getElementById('modal-total-price').textContent = utils.formatPrice(total);
                document.getElementById('checkout-name').value = store.user.name;
                document.getElementById('checkout-email').value = store.user.email;
                modal.open('checkout-modal');
            },

            processCheckout: (e) => {
                e.preventDefault();
                const btn = e.target.querySelector('button');
                const originalText = btn.textContent;
                btn.textContent = 'Processing...';
                btn.disabled = true;

                setTimeout(() => {
                    const orderData = {
                        id: utils.generateId().toUpperCase(),
                        customerName: document.getElementById('checkout-name').value,
                        customerEmail: document.getElementById('checkout-email').value,
                        customerPhone: document.getElementById('checkout-phone').value,
                        products: store.cart,
                        totalAmount: document.getElementById('modal-total-price').textContent,
                        date: new Date().toLocaleDateString(),
                        status: 'Paid'
                    };
                    db.orders.push(orderData);
                    store.cart.forEach(item => {
                        const p = db.products.find(x => x.id === item.productId);
                        if (p) p.stock -= item.qty;
                    });
                    db.save();
                    store.updateCart([]);
                    modal.close('checkout-modal');
                    utils.showToast('Order placed successfully!');
                    btn.textContent = originalText;
                    btn.disabled = false;
                    router.navigate('/profile');
                }, 2000);
            },

            // --- ADMIN LOGIC ---
            switchAdminTab: (tab) => {
                document.querySelectorAll('.admin-menu li').forEach(li => li.classList.remove('active'));
                document.getElementById(`tab-${tab}`).classList.add('active');
                const content = document.getElementById('admin-view-content');

                if (tab === 'dashboard') {
                    const totalSales = db.orders.reduce((acc, o) => acc + parseFloat(o.totalAmount), 0);
                    content.innerHTML = `
                        <h2>Dashboard Analytics</h2>
                        <div class="grid grid-3 mt-20">
                            <div class="stat-card"><h3>Total Sales</h3><div class="stat-number">$${utils.formatPrice(totalSales)}</div></div>
                            <div class="stat-card"><h3>Total Orders</h3><div class="stat-number">${db.orders.length}</div></div>
                            <div class="stat-card"><h3>Products</h3><div class="stat-number">${db.products.length}</div></div>
                        </div>`;
                } else if (tab === 'products') {
                    content.innerHTML = `
                        <div class="flex flex-between mb-20"><h2>Manage Products</h2><button class="btn btn-sm" onclick="app.openAddProductModal()">+ Add Product</button></div>
                        <div class="table-wrapper">
                            <table>
                                <thead><tr><th>Image</th><th>Name</th><th>Price</th><th>Stock</th><th>Action</th></tr></thead>
                                <tbody>
                                    ${db.products.map(p => `
                                        <tr>
                                            <td><img src="${p.image}" style="width:40px; height:40px; object-fit:cover; border-radius:4px;"></td>
                                            <td>${p.name}</td>
                                            <td>$${p.price}</td>
                                            <td>${p.stock}</td>
                                            <td><button class="btn-sm btn-danger" onclick="app.deleteProduct(${p.id})">Delete</button></td>
                                        </tr>`).join('')}
                                </tbody>
                            </table>
                        </div>`;
                } else if (tab === 'orders') {
                    content.innerHTML = `
                        <h2>Customer Orders</h2>
                        <div class="table-wrapper">
                            <table>
                                <thead><tr><th>Order ID</th><th>Customer</th><th>Date</th><th>Total</th></tr></thead>
                                <tbody>
                                    ${db.orders.map(o => `
                                        <tr>
                                            <td>${o.id}</td>
                                            <td>${o.customerName}<br><small>${o.customerEmail}</small></td>
                                            <td>${o.date}</td>
                                            <td>$${o.totalAmount}</td>
                                        </tr>`).join('')}
                                </tbody>
                            </table>
                        </div>`;
                } else if (tab === 'users') {
                    // --- NEW USER CONTROL PANEL ---
                    content.innerHTML = `
                        <h2>User Management</h2>
                        <div class="table-wrapper">
                            <table>
                                <thead>
                                    <tr>
                                        <th>User</th>
                                        <th>Email</th>
                                        <th>Role</th>
                                        <th>Total Spent</th>
                                        <th>Actions</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    ${db.users.map(u => {
                        // Calculate total spent per user
                        const userOrders = db.orders.filter(o => o.customerEmail === u.email);
                        const totalSpent = userOrders.reduce((acc, o) => acc + parseFloat(o.totalAmount), 0);
                        const orderCount = userOrders.length;
                        const isMe = store.user.id === u.id; // Prevent self-deletion

                        return `
                                            <tr>
                                                <td><strong>${u.name}</strong></td>
                                                <td>${u.email}</td>
                                                <td><span style="text-transform:capitalize; font-size:0.8rem; padding:2px 6px; background:${u.role === 'admin' ? '#e0e0e0' : 'transparent'}; border-radius:4px;">${u.role}</span></td>
                                                <td>
                                                    <div>$${utils.formatPrice(totalSpent)}</div>
                                                    <small style="color:var(--secondary-text)">${orderCount} orders</small>
                                                </td>
                                                <td>
                                                    <button class="btn-sm btn-outline" onclick="app.viewUserHistory('${u.email}')">Details</button>
                                                    ${!isMe ? `<button class="btn-sm btn-danger" style="margin-left:5px" onclick="app.deleteUser('${u.id}')">Remove</button>` : '<small>(You)</small>'}
                                                </td>
                                            </tr>
                                        `;
                    }).join('')}
                                </tbody>
                            </table>
                        </div>
                    `;
                }
            },

            // --- ADMIN USER ACTIONS ---
            viewUserHistory: (email) => {
                const userOrders = db.orders.filter(o => o.customerEmail === email);
                const totalSpent = userOrders.reduce((acc, o) => acc + parseFloat(o.totalAmount), 0);

                let html = `
                    <div class="flex flex-between mb-20">
                        <div>
                            <h3 style="font-size:1.2rem">${email}</h3>
                            <p style="color:var(--secondary-text)">Total Spent: <strong>$${utils.formatPrice(totalSpent)}</strong></p>
                        </div>
                    </div>
                    <h4>Order History</h4>
                `;

                if (userOrders.length === 0) {
                    html += `<p style="padding:20px 0; color:var(--secondary-text)">No orders found for this user.</p>`;
                } else {
                    html += `<div style="max-height: 300px; overflow-y: auto;">`;
                    userOrders.forEach(o => {
                        // Reconstruct product list from stored IDs
                        const itemsHtml = o.products.map(item => {
                            const product = db.products.find(p => p.id === item.productId);
                            const name = product ? product.name : 'Unknown Item';
                            const price = product ? product.price * item.qty : 0;
                            return `<li><span>${name} (x${item.qty})</span> <span>$${utils.formatPrice(price)}</span></li>`;
                        }).join('');

                        html += `
                            <div class="order-history-item">
                                <div class="order-header">
                                    <span>Order #${o.id}</span>
                                    <span>${o.date} - $${o.totalAmount}</span>
                                </div>
                                <ul class="order-products-list">
                                    ${itemsHtml}
                                </ul>
                            </div>
                        `;
                    });
                    html += `</div>`;
                }

                document.getElementById('user-details-content').innerHTML = html;
                modal.open('user-details-modal');
            },

            deleteUser: (id) => {
                if (confirm('Are you sure you want to delete this user? Their order history will remain in the system, but their account will be removed.')) {
                    db.users = db.users.filter(u => u.id !== id);
                    db.save();
                    app.switchAdminTab('users'); // Refresh list
                    utils.showToast('User deleted successfully');
                }
            },

            // --- PRODUCT ACTIONS ---
            openAddProductModal: () => {
                document.getElementById('add-product-form').reset();
                document.getElementById('product-img-preview').style.display = 'none';
                modal.open('add-product-modal');
            },

            previewImage: (input) => {
                const preview = document.getElementById('product-img-preview');
                if (input.files && input.files[0]) {
                    const reader = new FileReader();
                    reader.onload = function (e) {
                        preview.src = e.target.result;
                        preview.style.display = 'block';
                    }
                    reader.readAsDataURL(input.files[0]);
                }
            },

            handleAddProduct: async (e) => {
                e.preventDefault();
                const form = e.target;
                const fileInput = document.getElementById('product-image-input');
                let imageUrl = `https://picsum.photos/seed/${form.name.value}/300/300`;

                if (fileInput.files && fileInput.files[0]) {
                    try {
                        imageUrl = await new Promise((resolve) => {
                            const reader = new FileReader();
                            reader.onload = (e) => resolve(e.target.result);
                            reader.readAsDataURL(fileInput.files[0]);
                        });
                    } catch (err) { console.error("Image read error", err); }
                }

                const newProd = {
                    id: Date.now(),
                    name: form.name.value,
                    price: parseFloat(form.price.value),
                    stock: parseInt(form.stock.value),
                    category: form.category.value,
                    desc: form.desc.value,
                    image: imageUrl
                };

                db.products.push(newProd);
                db.save();
                modal.close('add-product-modal');
                app.switchAdminTab('products');
                utils.showToast('Product added successfully');
            },

            deleteProduct: (id) => {
                if (confirm('Are you sure you want to delete this product?')) {
                    db.products = db.products.filter(p => p.id !== id);
                    db.save();
                    app.switchAdminTab('products');
                    utils.showToast('Product deleted');
                }
            },

            filterProducts: (cat) => {
                const grid = document.getElementById('shop-grid');
                let filtered = db.products;
                if (cat !== 'all') filtered = db.products.filter(p => p.category === cat);
                grid.innerHTML = filtered.map(p => components.productCard(p)).join('');
            },

            sortProducts: (val) => {
                const grid = document.getElementById('shop-grid');
                let sorted = [...db.products];
                if (val === 'price-asc') sorted.sort((a, b) => a.price - b.price);
                if (val === 'price-desc') sorted.sort((a, b) => b.price - a.price);
                grid.innerHTML = sorted.map(p => components.productCard(p)).join('');
            }
        };

        const modal = {
            open: (id) => { document.getElementById(id).classList.add('open'); },
            close: (id) => { document.getElementById(id).classList.remove('open'); }
        };

        document.addEventListener('DOMContentLoaded', app.init);

    </script>
</body>

</html>
